server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  sendfile on;
  tcp_nopush on;

  # Hashed bundles and assets are immutable, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Everything else is an HTML document.
  #
  # React Router is a client-side router: /dashboard has no file of its own, so
  # every request that is not a real file falls back to index.html and the app
  # resolves the route from window.location once it hydrates.
  location / {
    try_files $uri $uri.html $uri/index.html /index.html;

    # HTML must not be cached — after a redeploy a stale document would point
    # at hashed bundles that no longer exist.
    expires -1;
    add_header Cache-Control "no-store, must-revalidate";
  }
}