server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  sendfile on;
  tcp_nopush on;

  # Hashed bundles and assets are immutable, so they can be cached hard.
  # These prefixes are matched before the catch-all below.
  location /_expo/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public";
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Everything else is an HTML document.
  #
  # Expo's static export writes one file per route: /dashboard is
  # dashboard.html, /inventory is inventory/index.html. Both shapes are tried
  # before the fallback.
  #
  # The fallback matters for dynamic routes. /transactions/trx_001 has no file
  # of its own — the export writes transactions/[id].html, which no URL will
  # ever match — so it lands on index.html and Expo Router resolves the real
  # route from window.location once it hydrates. The page ends up correct; only
  # the pre-rendered HTML is generic.
  location / {
    try_files $uri $uri.html $uri/index.html /index.html;

    # Set here rather than in a `~* \.html$` block: try_files serves the file
    # it finds without re-running location matching, so a regex location would
    # never see /dashboard and the header would silently not apply.
    #
    # HTML must not be cached — after a redeploy a stale document would point
    # at hashed bundles that no longer exist.
    expires -1;
    add_header Cache-Control "no-store, must-revalidate";
  }
}
