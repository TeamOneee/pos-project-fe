# Included by every location in nginx.conf. Lives outside conf.d/, which nginx
# auto-includes as server blocks.
#
# The full CSP is a <meta> on the document itself (vite.config.ts); this is what
# a meta tag cannot express. `always` so error responses carry them too.

add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
