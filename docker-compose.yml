# Two ways to run the web frontend.
#
#   docker compose up --build            → the built app on http://localhost:8080
#   docker compose --profile dev up      → the Vite dev server on http://localhost:5173
#
# Both default to mock mode, so neither needs a backend: the IndoMart dataset
# is served from inside the browser bundle.

services:
  # The one to use for "let me just look at it".
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # VITE_* is compiled into the bundle, so these are build args and
        # not environment variables. Changing them requires --build.
        VITE_API_MODE: ${VITE_API_MODE:-mock}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-15000}
        VITE_MOCK_LATENCY_MS: ${VITE_MOCK_LATENCY_MS:-220}
    image: pos-fe-web:latest
    ports:
      - '${WEB_PORT:-8080}:80'
    restart: unless-stopped

  # Opt-in: hot reload against the source on your machine.
  dev:
    profiles: ['dev']
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: pos-fe-web-dev:latest
    ports:
      - '${DEV_PORT:-5173}:5173'
    volumes:
      - .:/app
      # Keeps the container's node_modules rather than shadowing them with the
      # host's, which are built for a different platform.
      - /app/node_modules
    environment:
      VITE_API_MODE: ${VITE_API_MODE:-mock}
    stdin_open: true
    tty: true